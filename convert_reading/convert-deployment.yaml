apiVersion: apps/v1
kind: Deployment
metadata:
  name: convert-reading-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convert-reading
  template:
    metadata:
      labels:
        app: convert-reading
    spec:
      containers:
        - name: convert-reading
          image: northamerica-northeast2-docker.pkg.dev/project-4cfdac74-a7d9-4d41-abf/sofe4630u/convert-reading:latest
          env:
            - name: GCP_PROJECT
              value: "project-4cfdac74-a7d9-4d41-abf"